<script id="pune-mirror-mobile-js">
(function() {
  const MIRRORS = [{"id": "9f90b556-f0b", "seq": "#001", "lat": 18.47599407767, "lon": 73.862320157282, "status": "confirmed", "confidence": 0.691, "heading": 356}, {"id": "cf7079c2-d7d", "seq": "#002", "lat": 18.471555423225, "lon": 73.863463381744, "status": "confirmed", "confidence": 0.679, "heading": 336}, {"id": "98045bad-257", "seq": "#003", "lat": 18.475801324544, "lon": 73.862345543813, "status": "confirmed", "confidence": 0.662, "heading": 4}, {"id": "29099bfa-de2", "seq": "#004", "lat": 18.474625159671, "lon": 73.862414951852, "status": "confirmed", "confidence": 0.652, "heading": 353}, {"id": "9e4ca91a-682", "seq": "#005", "lat": 18.475115130695, "lon": 73.861082657885, "status": "confirmed", "confidence": 0.649, "heading": 275}, {"id": "9fe75831-46a", "seq": "#006", "lat": 18.476261707965, "lon": 73.862303710619, "status": "confirmed", "confidence": 0.631, "heading": 351}, {"id": "6e9fe259-731", "seq": "#007", "lat": 18.47507303203, "lon": 73.861366847061, "status": "confirmed", "confidence": 0.597, "heading": 319}, {"id": "9c9a4e30-7cf", "seq": "#008", "lat": 18.474859069093, "lon": 73.858334668006, "status": "confirmed", "confidence": 0.582, "heading": 264}, {"id": "5320264b-337", "seq": "#009", "lat": 18.473231254708, "lon": 73.858137793036, "status": "confirmed", "confidence": 0.58, "heading": 163}, {"id": "fa9dac6e-ad5", "seq": "#010", "lat": 18.474905164111, "lon": 73.859383824291, "status": "confirmed", "confidence": 0.575, "heading": 263}, {"id": "a09e2161-6bf", "seq": "#011", "lat": 18.475901503459, "lon": 73.86245656, "status": "confirmed", "confidence": 0.569, "heading": 158}, {"id": "884cbcc1-d65", "seq": "#012", "lat": 18.473394024773, "lon": 73.858057435449, "status": "confirmed", "confidence": 0.555, "heading": 154}, {"id": "2427af78-11c", "seq": "#013", "lat": 18.473088569124, "lon": 73.858181174343, "status": "confirmed", "confidence": 0.541, "heading": 163}, {"id": "91964863-6e8", "seq": "#014", "lat": 18.47491675483, "lon": 73.85923939975, "status": "confirmed", "confidence": 0.539, "heading": 269}, {"id": "46377d4c-295", "seq": "#015", "lat": 18.4754976652, "lon": 73.8624971062, "status": "confirmed", "confidence": 0.511, "heading": 172}, {"id": "1ff9d5fa-ca2", "seq": "#016", "lat": 18.474872132736, "lon": 73.858159695691, "status": "confirmed", "confidence": 0.449, "heading": 267}];

  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat/2)**2 +
              Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function formatDist(m) {
    if (m < 1000) return Math.round(m) + ' m';
    return (m / 1000).toFixed(2) + ' km';
  }

  function findNearest(lat, lon) {
    let best = null, bestD = Infinity;
    for (const m of MIRRORS) {
      const d = haversine(lat, lon, m.lat, m.lon);
      if (d < bestD) { bestD = d; best = m; }
    }
    return best ? { mirror: best, distance: bestD } : null;
  }

  function getMap() {
    for (const k of Object.keys(window)) {
      if (k.startsWith('map_') && window[k] && window[k].setView) return window[k];
    }
    return null;
  }

  let userMarker = null, routeLine = null, nearestMarker = null;

  function showToast(msg) {
    const t = document.getElementById('pm-toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 5000);
  }

  function clearOverlays(map) {
    if (userMarker) { map.removeLayer(userMarker); userMarker = null; }
    if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
    if (nearestMarker) { nearestMarker = null; }
  }

  function onNearestFound(map, lat, lon, result) {
    const { mirror, distance } = result;
    clearOverlays(map);

    userMarker = L.circleMarker([lat, lon], {
      radius: 10, color: '#2563eb', fillColor: '#3b82f6', fillOpacity: 1, weight: 3
    }).addTo(map).bindPopup('<b>You are here</b>');

    routeLine = L.polyline([[lat, lon], [mirror.lat, mirror.lon]], {
      color: '#2563eb', weight: 4, dashArray: '8 8', opacity: .8
    }).addTo(map);

    map.fitBounds(routeLine.getBounds(), { padding: [60, 60], maxZoom: 18 });

    const panel = document.getElementById('pm-panel');
    document.getElementById('pm-title').textContent = 'Nearest Mirror: ' + mirror.seq;
    document.getElementById('pm-dist').textContent = formatDist(distance);
    document.getElementById('pm-meta').innerHTML =
      'Status: <b>' + mirror.status + '</b> &middot; Confidence: ' + mirror.confidence +
      '<br>Heading: ' + mirror.heading + '&deg;';
    const navUrl = 'https://www.google.com/maps/dir/?api=1&origin=' +
      lat + ',' + lon + '&destination=' + mirror.lat + ',' + mirror.lon + '&travelmode=walking';
    document.getElementById('pm-nav').href = navUrl;
    panel.classList.add('open');

    map.eachLayer(function(layer) {
      if (layer instanceof L.Marker && layer.getLatLng) {
        const ll = layer.getLatLng();
        if (Math.abs(ll.lat - mirror.lat) < 1e-6 && Math.abs(ll.lng - mirror.lon) < 1e-6) {
          layer.openPopup();
        }
      }
    });
  }

  function locateNearest() {
    const btn = document.getElementById('pm-nearest-btn');
    const map = getMap();
    if (!map) { showToast('Map not ready. Please refresh.'); return; }
    if (!MIRRORS.length) { showToast('No mirrors on the map yet.'); return; }
    if (!navigator.geolocation) {
      showToast('Geolocation is not supported on this browser.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Locating…';

    navigator.geolocation.getCurrentPosition(
      function(pos) {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const result = findNearest(lat, lon);
        btn.disabled = false;
        btn.textContent = '📍 Find Nearest Mirror';
        if (!result) { showToast('No mirrors found.'); return; }
        onNearestFound(map, lat, lon, result);
      },
      function(err) {
        btn.disabled = false;
        btn.textContent = '📍 Find Nearest Mirror';
        const msgs = {
          1: 'Location permission denied. Allow location access in your browser settings.',
          2: 'Location unavailable. Try again outdoors with GPS enabled.',
          3: 'Location request timed out. Please try again.'
        };
        showToast(msgs[err.code] || 'Could not get your location.');
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  }

  document.addEventListener('DOMContentLoaded', function() {
    const btn = document.createElement('button');
    btn.id = 'pm-nearest-btn';
    btn.textContent = '📍 Find Nearest Mirror';
    btn.onclick = locateNearest;
    document.body.appendChild(btn);

    const toast = document.createElement('div');
    toast.id = 'pm-toast';
    document.body.appendChild(toast);

    const panel = document.createElement('div');
    panel.id = 'pm-panel';
    panel.innerHTML =
      '<h3 id="pm-title">Nearest Mirror</h3>' +
      '<div class="pm-dist" id="pm-dist">—</div>' +
      '<div class="pm-meta" id="pm-meta"></div>' +
      '<div class="pm-actions">' +
        '<a id="pm-nav" class="pm-nav" href="#" target="_blank" rel="noopener">Navigate</a>' +
        '<button class="pm-close" onclick="document.getElementById(\'pm-panel\').classList.remove(\'open\')">Close</button>' +
      '</div>';
    document.body.appendChild(panel);

    const vp = document.querySelector('meta[name="viewport"]');
    if (vp) {
      vp.setAttribute('content',
        'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover');
    }
  });
})();
